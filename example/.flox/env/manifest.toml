## acdev example / test environment ----------------------------------
##
## Activating this environment puts the locally-built `acdev` package on
## PATH and registers the cd->container-shell auto-handoff hooks. Then
## `cd` into a directory containing `.applecontainer.toml` (e.g. the
## bundled `demo-project/`) to trigger the handoff.
##
## Prerequisite: build the package once from the repo root:
##     flox build acdev          # -> ./result-acdev
## then activate this environment:
##     flox activate -d example
## -------------------------------------------------------------------
schema-version = "1.12.0"

[install]
# Nothing from the catalog: acdev is consumed from the repo's own
# `flox build acdev` output (../result-acdev), wired up in [profile] below.

## Profile script ----------------------------------------------------
## Sourced by your interactive shell on `flox activate`, so the hooks'
## cd/chpwd overrides take effect in the shell you land in. The package
## is the `result-acdev` symlink produced by `flox build acdev` at the
## repo root (one level up from this env's project dir).
## -------------------------------------------------------------------
[profile]
bash = '''
  _acdev_pkg="$(cd "$FLOX_ENV_PROJECT/.." 2>/dev/null && pwd -P)/result-acdev"
  if [ -x "$_acdev_pkg/bin/acdev" ]; then
    case ":$PATH:" in *":$_acdev_pkg/bin:"*) ;; *) PATH="$_acdev_pkg/bin:$PATH" ;; esac
    export PATH
    . "$_acdev_pkg/share/acdev/hooks/acdev.bash"
  else
    echo "acdev: package not built yet -- run 'flox build acdev' in the repo root, then re-activate." >&2
  fi
'''
zsh = '''
  _acdev_pkg="$(cd "$FLOX_ENV_PROJECT/.." 2>/dev/null && pwd -P)/result-acdev"
  if [ -x "$_acdev_pkg/bin/acdev" ]; then
    case ":$PATH:" in *":$_acdev_pkg/bin:"*) ;; *) PATH="$_acdev_pkg/bin:$PATH" ;; esac
    export PATH
    . "$_acdev_pkg/share/acdev/hooks/acdev.zsh"
  else
    echo "acdev: package not built yet -- run 'flox build acdev' in the repo root, then re-activate." >&2
  fi
'''
fish = '''
  set _acdev_pkg (cd "$FLOX_ENV_PROJECT/.." 2>/dev/null; and pwd -P)"/result-acdev"
  if test -x "$_acdev_pkg/bin/acdev"
      if not contains "$_acdev_pkg/bin" $PATH
          set -gx PATH "$_acdev_pkg/bin" $PATH
      end
      source "$_acdev_pkg/share/acdev/hooks/acdev.fish"
  else
      echo "acdev: package not built yet -- run 'flox build acdev' in the repo root, then re-activate." >&2
  end
'''

[options]
# This example only targets Apple silicon macOS.
systems = ["aarch64-darwin"]

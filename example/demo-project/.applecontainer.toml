# acdev project config — makes this directory acdev-managed.
#
# No `image` line: this project tracks acdev's default image
# (jbayer/devcontainer-flox:latest). To pin one image for every project in this
# environment, set ACDEV_DEFAULT_IMAGE in the example env's [vars] (see manifest).
# To pin just this project, add an explicit `image = "...@sha256:..."`.

# user      = "flox"                # exec/run as this user
# workspace = "/workspaces/<dir>"   # default: /workspaces/<basename of this dir>
# shell     = "bash"                # shell to drop into
# flox      = "auto"                # auto = activate iff .flox/ exists; true/false to force
# nix_cache = "http://192.168.64.1:8126"  # use the host nix-cache proxy (see README)

# Environment variables passed into the container:
# [env]
# EXAMPLE = "value"

    "profile": {
      "common": "msg=\"🍎 acdev-demo — cd → container shell handoff to Apple Container\n\nTry it:\n  cd demo-project          auto-handoff into a flox container shell\n\nCommands:\n  acdev init               create .applecontainer.toml in the current dir\n  acdev up                 create or reuse this project's container\n  acdev shell              enter the container shell\n  acdev status             name / state / image + digest / mount / IP\n  acdev down [--rm]        stop the container (--rm also removes it)\"\n\ngum style --border rounded --margin \"1 0\" --padding \"1 2\" --border-foreground 39 \"$msg\"\n",
      "bash": "  [ -r \"$FLOX_ENV/share/acdev/hooks/acdev.bash\" ] && . \"$FLOX_ENV/share/acdev/hooks/acdev.bash\"\n",
      "zsh": "  [ -r \"$FLOX_ENV/share/acdev/hooks/acdev.zsh\" ] && . \"$FLOX_ENV/share/acdev/hooks/acdev.zsh\"\n",
      "fish": "  test -r \"$FLOX_ENV/share/acdev/hooks/acdev.fish\"; and source \"$FLOX_ENV/share/acdev/hooks/acdev.fish\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin"
      ]
    },
    "services": {
      "auto-start": true,
      "nix-cache": {
        "command": "ACDEV_NIX_CACHE_DIR=\"$FLOX_ENV_CACHE/nix-cache\" acdev-nix-cache"
      }
    }
  },

schema-version = "1.12.0"

[install]
# The published package: puts `acdev` on PATH ($FLOX_ENV/bin) and ships
# the hooks at $FLOX_ENV/share/acdev/hooks/acdev.{bash,zsh,fish}.
acdev.pkg-path = "jbayer/acdev"
acdev.version = "0.1.6"
nginx.pkg-path = "nginx"
# gum draws the usage banner printed on activate.
gum.pkg-path = "gum"

## Profile script ----------------------------------------------------
## Sourced by your interactive shell on `flox activate`, so the hooks'
## cd/chpwd overrides take effect in the shell you land in. `acdev`
## itself is already on PATH via [install]; here we only register the
## matching shell hook from the installed package.
## -------------------------------------------------------------------
[profile]
common='''
msg="🍎 acdev-demo — cd → container shell handoff to Apple Container

Try it:
  cd demo-project          auto-handoff into a flox container shell

Commands:
  acdev init               create .applecontainer.toml in the current dir
  acdev up                 create or reuse this project's container
  acdev shell              enter the container shell
  acdev status             name / state / image / mount / IP
  acdev down [--rm]        stop the container (--rm also removes it)"

gum style --border rounded --margin "1 0" --padding "1 2" --border-foreground 39 "$msg"
'''
bash = '''
  [ -r "$FLOX_ENV/share/acdev/hooks/acdev.bash" ] && . "$FLOX_ENV/share/acdev/hooks/acdev.bash"
'''
zsh = '''
  [ -r "$FLOX_ENV/share/acdev/hooks/acdev.zsh" ] && . "$FLOX_ENV/share/acdev/hooks/acdev.zsh"
'''
fish = '''
  test -r "$FLOX_ENV/share/acdev/hooks/acdev.fish"; and source "$FLOX_ENV/share/acdev/hooks/acdev.fish"
'''

## Pin acdev's default image for every project under this environment
## (built-in default: jbayer/devcontainer-flox:latest). A project's own
## `image` line still wins.
[vars]
# ACDEV_DEFAULT_IMAGE = "jbayer/devcontainer-flox:latest@sha256:..."

## Shared Nix binary cache: an nginx proxy for cache.flox.dev and
## cache.nixos.org on :8126. auto-start runs it on `flox activate`, and
## `acdev init` then enables `nix_cache` in new projects automatically.
[services]
auto-start = true

[services.nix-cache]
command = "ACDEV_NIX_CACHE_DIR=\"$FLOX_ENV_CACHE/nix-cache\" acdev-nix-cache"

[options]
# This example only targets Apple silicon macOS.
systems = ["aarch64-darwin"]

# Drop this file at the root of a project to make it acdev-managed.
# `image` is optional: omit it to track acdev's default (jbayer/devcontainer-flox:latest)
# or the ACDEV_DEFAULT_IMAGE env var. Set it explicitly to reuse your own project
# image — a digest pin (image@sha256:...) is recommended for reproducibility.
image = "jbayer/devcontainer-flox:latest"

# Optional (defaults shown):
user      = "flox"                  # exec/run as this user
# workspace = "/workspaces/myproj"  # default: /workspaces/<dir-basename>
shell     = "bash"                  # shell to drop into
flox      = "auto"                  # auto = activate iff .flox/ exists; true/false to force
# nix_cache = "http://192.168.64.1:8126"  # use the host nix-cache proxy (see README)

# [env]
# EXAMPLE = "value"
